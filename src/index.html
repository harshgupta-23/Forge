<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent System Dashboard</title>
  <link id="hljs-theme" rel="stylesheet" href="vendor/hljs-dark.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
<div id="app-container">
  <div id="connection-banner" class="hidden">
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Connection lost — the backend may have stopped.
    <button id="btn-reconnect">Reload</button>
  </div>
  <header>
    <h2>
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
      Forge — Local AI Assistant
    </h2>
    <button id="btn-new-session" title="Start a new session">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Session
    </button>
    <button id="btn-undo">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      Undo
    </button>
    <button id="btn-summarise">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Summarise
    </button>
    <button id="btn-tree-view">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
      Tree View
    </button>
    <button id="btn-fetch-session">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Previous Sessions
    </button>
    <button id="toggle-settings">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </header>

  <div id="token-usage-bar">
    <span id="tokens-5h" title="Tokens used in the last 5 hours">5h: –</span>
    <span id="tokens-24h" title="Tokens used in the last 24 hours">24h: –</span>
  </div>
  
  <div id="tree-view-panel" class="hidden">
    <div class="panel-header">
      <h3 style="margin: 0; font-size: 16px;">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
        Conversation Branches
      </h3>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button id="btn-detach-tree" class="node-btn" title="Open tree in an independent native window" style="display: flex; align-items: center; gap: 4px; padding: 2px 8px; font-size: 12px;">
          <svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Detach
        </button>
        <button id="close-tree-view" style="padding: 2px 8px; font-size: 14px;">✕</button>
      </div>
    </div>
    <div id="tree-container"></div>
    <div id="tree-resize-handle"></div>
  </div>

  <div id="session-picker-panel" class="hidden">
    <div class="panel-header">
      <h3 style="margin: 0; font-size: 16px;">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Previous Sessions
      </h3>
      <button id="close-session-picker" style="padding: 2px 8px; font-size: 14px;">✕</button>
    </div>
    <div id="session-list-container"></div>
  </div>

  <div id="settings-panel" class="hidden">
    <div class="panel-header">
      <h3 style="margin: 0;">Environment Configuration</h3>
      <button id="close-settings" style="padding: 2px 8px; font-size: 14px;">✕</button>
    </div>
    <label>API Key:
      <input type="password" id="cfg-key" placeholder="Enter API Key">
    </label>
    <label>API Base URL:
      <input type="text" id="cfg-base" placeholder="https://openrouter.ai/api/v1">
    </label>
    <label>Active Engine Model:
      <input type="text" id="cfg-model">
    </label>
    <label>Working Output Path:
      <input type="text" id="cfg-dir">
    </label>
    <label>Database URL:
      <input type="text" id="cfg-db" placeholder="postgresql://postgres:postgres@localhost:5432/forge (leave blank for SQLite)">
    </label>
    <label>Visual Interface Scheme:
      <select id="cfg-theme">
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
      </select>
    </label>
    <button id="save-settings">Commit Setup Changes</button>
  </div>

  <div id="terminal-chat">
    <div id="logs"></div>
    <div id="agent-status-bar"></div>
  </div>

  <div id="drop-zone" title="Click to browse or drop files">Drop file here or click to attach</div>
  <input type="file" id="file-picker-input" style="display: none;" multiple>

  <div id="path-input-area">
    <input type="text" id="path-input" placeholder="Or paste absolute path: C:\Users\...">
    <button id="attach-path-btn">Attach Path</button>
  </div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="Issue localized platform execution command...">
    <button id="send-btn">Execute</button>
    <button id="btn-stop" class="hidden">
      <svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      Stop
    </button>
  </div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="md-render.js"></script>
<script src="main.js"></script>
</body>
</html>
