<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge — Conversation Branches</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" id="hljs-theme" href="vendor/hljs-dark.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary, #121216);
      color: var(--text-main, #f5f5f5);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #standalone-app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    .tree-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 16px;
      background: var(--bg-panel, #1e1e24);
      border-bottom: 1px solid var(--border-color, #2e2e38);
      user-select: none;
      flex-shrink: 0;
      z-index: 100;
    }

    .tree-toolbar-left, .tree-toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tree-toolbar-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.3px;
      color: #f8fafc;
    }

    .tree-toolbar-title svg {
      color: var(--accent, #00fa9a);
    }

    .tree-session-badge {
      font-size: 11px;
      font-family: monospace;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #e2e8f0;
      letter-spacing: 0.2px;
    }

    .tree-tool-btn {
      background: #2a2a34;
      border: 1px solid #4a4a5a;
      color: #ffffff;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      line-height: 1.3;
    }

    .tree-tool-btn:hover {
      background: #383846;
      border-color: var(--accent, #00fa9a);
      color: var(--accent, #00fa9a);
    }

    .zoom-text {
      font-size: 12px;
      font-weight: 600;
      font-family: monospace;
      min-width: 44px;
      text-align: center;
      color: #f1f5f9;
    }

    /* Light theme overrides */
    body.light-theme .tree-toolbar-title {
      color: #0f172a;
    }

    body.light-theme .tree-toolbar-title svg {
      color: var(--accent, #007aff);
    }

    body.light-theme .tree-session-badge {
      background: rgba(0, 0, 0, 0.06);
      border-color: rgba(0, 0, 0, 0.15);
      color: #334155;
    }

    body.light-theme .tree-tool-btn {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #0f172a;
    }

    body.light-theme .tree-tool-btn:hover {
      background: #e2e8f0;
      border-color: var(--accent, #007aff);
      color: var(--accent, #007aff);
    }

    body.light-theme .zoom-text {
      color: #0f172a;
    }

    .tree-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
      display: inline-block;
      transition: background 0.3s ease;
    }

    .tree-status-dot.online {
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }

    .tree-status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
    }

    #tree-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 44px);
      position: relative;
      overflow: hidden;
      cursor: grab;
      border: none;
      border-radius: 0;
      background: radial-gradient(circle, var(--border-color) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    #tree-container:active {
      cursor: grabbing;
    }

    .canvas-hint {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.65;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>
</head>
<body class="dark-theme">
  <div id="standalone-app">
    <div class="tree-toolbar">
      <div class="tree-toolbar-left">
        <div class="tree-toolbar-title">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="3" x2="6" y2="15"/>
            <circle cx="18" cy="6" r="3"/>
            <circle cx="6" cy="18" r="3"/>
            <path d="M18 9a9 9 0 0 1-9 9"/>
          </svg>
          <span>Conversation Tree</span>
        </div>
        <span id="tree-session-badge" class="tree-session-badge">Connecting...</span>
      </div>
      <div class="tree-toolbar-right">
        <button id="btn-zoom-out" class="tree-tool-btn" title="Zoom Out">−</button>
        <span id="zoom-value" class="zoom-text">100%</span>
        <button id="btn-zoom-in" class="tree-tool-btn" title="Zoom In">+</button>
        <button id="btn-zoom-reset" class="tree-tool-btn" title="Reset View">⟲ Fit</button>
        <span id="tree-status-indicator" class="tree-status-dot offline" title="Backend Connection Status"></span>
      </div>
    </div>
    <div id="tree-container">
      <div class="canvas-hint">Drag canvas to pan · Scroll to zoom · Click node to activate branch</div>
    </div>
  </div>

  <script src="tree.js"></script>
</body>
</html>
