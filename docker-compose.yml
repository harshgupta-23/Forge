services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: forge-backend
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/forge
      - ALLOWED_ORIGINS=*
      - PYTHONUNBUFFERED=1
    volumes:
      - forge_data:/home/forge/.forge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - forge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  forge_postgres_data:
    driver: local
  forge_data:
    driver: local
