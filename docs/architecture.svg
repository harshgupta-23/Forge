<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 840 692" role="img">
<title>Forge architecture diagram</title>
<desc>Three-layer architecture: Tauri desktop shell with Chat, Tree Canvas, and Session Browser, connected via local WebSocket to a Python sidecar with ConversationTree, context pruning, LangGraph reasoning, and tools, connecting to OpenAI-compatible LLMs.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  text {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .title { font-size: 14px; font-weight: 600; }
  .subtitle { font-size: 11px; font-weight: 400; }
  .card-title { font-size: 13px; font-weight: 600; }
  .card-sub { font-size: 11px; font-weight: 400; }
  .pill-text { font-size: 11px; font-weight: 500; }
  .list-text { font-size: 10.5px; font-weight: 400; }
</style>

<!-- ════════════════════════════════════════════════════════════════════════════ -->
<!-- 1. TAURI DESKTOP SHELL                                                       -->
<!-- ════════════════════════════════════════════════════════════════════════════ -->
<g>
  <!-- Main Shell Container -->
  <rect x="40" y="24" width="760" height="136" rx="14" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
  <text x="60" y="48" class="title" fill="#444441">Tauri desktop shell (Rust + Vanilla Web UI)</text>
  <text x="60" y="65" class="subtitle" fill="#73726c">Native OS window · Launches Python sidecar · Cross-platform (Windows &amp; Linux)</text>

  <!-- Card 1: Chat UI -->
  <rect x="56" y="82" width="170" height="62" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.75"/>
  <text x="141" y="103" text-anchor="middle" class="card-title" fill="#3c3489">Chat Interface</text>
  <text x="141" y="121" text-anchor="middle" class="card-sub" fill="#534ab7">Streaming · Markdown</text>
  <text x="141" y="134" text-anchor="middle" class="card-sub" fill="#534ab7">Feather vector icons</text>

  <!-- Card 2: Tree View Canvas -->
  <rect x="242" y="82" width="170" height="62" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.75"/>
  <text x="327" y="103" text-anchor="middle" class="card-title" fill="#3c3489">Tree Canvas</text>
  <text x="327" y="121" text-anchor="middle" class="card-sub" fill="#534ab7">Pan &amp; zoom navigation</text>
  <text x="327" y="134" text-anchor="middle" class="card-sub" fill="#534ab7">Bezier branch graph</text>

  <!-- Card 3: Session Browser -->
  <rect x="428" y="82" width="170" height="62" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.75"/>
  <text x="513" y="103" text-anchor="middle" class="card-title" fill="#3c3489">Session Browser</text>
  <text x="513" y="121" text-anchor="middle" class="card-sub" fill="#534ab7">Preview &amp; resume tree</text>
  <text x="513" y="134" text-anchor="middle" class="card-sub" fill="#534ab7">Rename &amp; export tree</text>

  <!-- Card 4: Settings & Attachments -->
  <rect x="614" y="82" width="170" height="62" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.75"/>
  <text x="699" y="103" text-anchor="middle" class="card-title" fill="#3c3489">Settings &amp; Files</text>
  <text x="699" y="121" text-anchor="middle" class="card-sub" fill="#534ab7">API keys &amp; models</text>
  <text x="699" y="134" text-anchor="middle" class="card-sub" fill="#534ab7">Drag &amp; drop files</text>
</g>

<!-- ════════════════════════════════════════════════════════════════════════════ -->
<!-- CONNECTOR 1: WebSocket Bridge                                                -->
<!-- ════════════════════════════════════════════════════════════════════════════ -->
<g>
  <line x1="420" y1="160" x2="420" y2="214" stroke="#73726c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="265" y="174" width="310" height="26" rx="6" fill="#ffffff" stroke="rgba(31, 30, 29, 0.2)" stroke-width="0.75"/>
  <text x="420" y="191" text-anchor="middle" class="pill-text" fill="#3d3d3a">Local WebSocket · ws://localhost:8765</text>
</g>

<!-- ════════════════════════════════════════════════════════════════════════════ -->
<!-- 2. PYTHON SIDECAR                                                            -->
<!-- ════════════════════════════════════════════════════════════════════════════ -->
<g>
  <!-- Main Sidecar Container -->
  <rect x="40" y="214" width="760" height="272" rx="14" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.75"/>
  <text x="60" y="238" class="title" fill="#085041">Python sidecar (app.py &amp; agent.py)</text>
  <text x="60" y="254" class="subtitle" fill="#0f6e56">WebSocket sidecar · Tree graph &amp; context pruning · Dynamic tool execution</text>

  <!-- Left: ConversationTree & Context Pruning Container -->
  <rect x="56" y="268" width="220" height="206" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="166" y="288" text-anchor="middle" class="card-title" fill="#444441">ConversationTree</text>
  <text x="166" y="302" text-anchor="middle" class="card-sub" fill="#73726c">Root · Turn · Summary nodes</text>

  <rect x="66" y="312" width="200" height="42" rx="6" fill="#ffffff" stroke="#0f6e56" stroke-width="0.75"/>
  <text x="166" y="328" text-anchor="middle" class="pill-text" fill="#085041">Context Pruner (Active Path)</text>
  <text x="166" y="343" text-anchor="middle" class="card-sub" fill="#0f6e56">Prunes dead branches</text>

  <rect x="66" y="360" width="200" height="42" rx="6" fill="#ffffff" stroke="#534ab7" stroke-width="0.75"/>
  <text x="166" y="376" text-anchor="middle" class="pill-text" fill="#3c3489">Session Tree Persistence</text>
  <text x="166" y="392" text-anchor="middle" class="card-sub" fill="#534ab7">JSON tree &amp; text logs</text>

  <rect x="66" y="408" width="200" height="42" rx="6" fill="#ffffff" stroke="#993c1d" stroke-width="0.75"/>
  <text x="166" y="424" text-anchor="middle" class="pill-text" fill="#993c1d">Rolling Token Telemetry</text>
  <text x="166" y="440" text-anchor="middle" class="card-sub" fill="#73726c">5h &amp; 24h rolling usage</text>

  <!-- Middle: LangGraph Reasoning Engine -->
  <rect x="292" y="268" width="232" height="206" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="408" y="288" text-anchor="middle" class="card-title" fill="#444441">LangGraph Agent Loop</text>
  <text x="408" y="302" text-anchor="middle" class="card-sub" fill="#73726c">Iterative reasoning &amp; execution</text>

  <!-- Loop Nodes -->
  <rect x="304" y="314" width="98" height="38" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.75"/>
  <text x="353" y="337" text-anchor="middle" class="pill-text" fill="#0c447c">agent_node</text>

  <line x1="402" y1="333" x2="424" y2="333" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="426" y="314" width="88" height="38" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.75"/>
  <text x="470" y="337" text-anchor="middle" class="pill-text" fill="#0c447c">tool_node</text>

  <path d="M 470 352 Q 411 370 353 352" fill="none" stroke="#73726c" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="411" y="367" text-anchor="middle" class="card-sub" fill="#73726c">up to 10 rounds</text>

  <rect x="304" y="378" width="208" height="36" rx="6" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="408" y="394" text-anchor="middle" class="pill-text" fill="#444441">Streaming &amp; Thought Filter</text>
  <text x="408" y="406" text-anchor="middle" class="card-sub" fill="#73726c">&lt;thought&gt; tags stripped</text>

  <rect x="304" y="420" width="208" height="36" rx="6" fill="#ffffff" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="408" y="436" text-anchor="middle" class="pill-text" fill="#444441">Smart History Summariser</text>
  <text x="408" y="448" text-anchor="middle" class="card-sub" fill="#73726c">Compresses past turn nodes</text>

  <!-- Right: Tools Container -->
  <rect x="540" y="268" width="244" height="206" rx="10" fill="#faeedb" stroke="#854f0b" stroke-width="0.5"/>
  <text x="662" y="288" text-anchor="middle" class="card-title" fill="#633806">Built-in &amp; Custom Tools</text>
  <text x="662" y="302" text-anchor="middle" class="card-sub" fill="#854f0b">Auto-discovered at runtime</text>

  <text x="554" y="322" class="list-text" fill="#3d3d3a">• browser_action (Playwright)</text>
  <text x="554" y="338" class="list-text" fill="#3d3d3a">• read_file &amp; write_file</text>
  <text x="554" y="354" class="list-text" fill="#3d3d3a">• run_local_python_script</text>
  <text x="554" y="370" class="list-text" fill="#3d3d3a">• web_search (DuckDuckGo)</text>
  <text x="554" y="386" class="list-text" fill="#3d3d3a">• clipboard &amp; screen capture</text>
  <text x="554" y="402" class="list-text" fill="#3d3d3a">• pip_install &amp; env_info</text>

  <rect x="550" y="418" width="224" height="44" rx="6" fill="#fdfaf3" stroke="#854f0b" stroke-width="0.5"/>
  <text x="662" y="435" text-anchor="middle" class="pill-text" fill="#633806">+ Drop-in custom tools</text>
  <text x="662" y="450" text-anchor="middle" class="card-sub" fill="#854f0b">~/.forge/tools/ · Guarded</text>
</g>

<!-- ════════════════════════════════════════════════════════════════════════════ -->
<!-- CONNECTOR 2: REST API Call                                                   -->
<!-- ════════════════════════════════════════════════════════════════════════════ -->
<g>
  <line x1="420" y1="486" x2="420" y2="538" stroke="#73726c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="265" y="500" width="310" height="26" rx="6" fill="#ffffff" stroke="rgba(31, 30, 29, 0.2)" stroke-width="0.75"/>
  <text x="420" y="517" text-anchor="middle" class="pill-text" fill="#3d3d3a">OpenAI-Compatible REST API (Streaming)</text>
</g>

<!-- ════════════════════════════════════════════════════════════════════════════ -->
<!-- 3. LLM PROVIDER LAYER                                                        -->
<!-- ════════════════════════════════════════════════════════════════════════════ -->
<g>
  <!-- Main LLM Container -->
  <rect x="40" y="538" width="760" height="130" rx="14" fill="#faece7" stroke="#993c1d" stroke-width="0.75"/>
  <text x="60" y="562" class="title" fill="#712b13">LLM Provider Layer</text>
  <text x="60" y="578" class="subtitle" fill="#993c1d">Any OpenAI-compatible API endpoint (cloud service or local inference engine)</text>

  <!-- Provider 1: Google AI Studio -->
  <rect x="56" y="592" width="170" height="62" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
  <text x="141" y="612" text-anchor="middle" class="card-title" fill="#444441">Google AI Studio</text>
  <text x="141" y="628" text-anchor="middle" class="card-sub" fill="#73726c">Gemini 2.0 &amp; Gemma</text>
  <text x="141" y="642" text-anchor="middle" class="card-sub" fill="#73726c">Cloud API</text>

  <!-- Provider 2: Ollama -->
  <rect x="242" y="592" width="170" height="62" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
  <text x="327" y="612" text-anchor="middle" class="card-title" fill="#444441">Ollama (Local)</text>
  <text x="327" y="628" text-anchor="middle" class="card-sub" fill="#73726c">Local inference</text>
  <text x="327" y="642" text-anchor="middle" class="card-sub" fill="#73726c">localhost:11434/v1</text>

  <!-- Provider 3: OpenRouter -->
  <rect x="428" y="592" width="170" height="62" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
  <text x="513" y="612" text-anchor="middle" class="card-title" fill="#444441">OpenRouter</text>
  <text x="513" y="628" text-anchor="middle" class="card-sub" fill="#73726c">Cloud model router</text>
  <text x="513" y="642" text-anchor="middle" class="card-sub" fill="#73726c">Claude · GPT-4o</text>

  <!-- Provider 4: LM Studio -->
  <rect x="614" y="592" width="170" height="62" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.75"/>
  <text x="699" y="612" text-anchor="middle" class="card-title" fill="#444441">LM Studio (Local)</text>
  <text x="699" y="628" text-anchor="middle" class="card-sub" fill="#73726c">Local inference</text>
  <text x="699" y="642" text-anchor="middle" class="card-sub" fill="#73726c">localhost:1234/v1</text>
</g>

</svg>